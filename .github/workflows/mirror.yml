name: Mirroring

on: [push, delete]

jobs:
  to_github:
    if: github.repository == 'Epitech2026-2027/I-DEV-700-INT-7-1-timemanager-18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@github.com:Kalambodaniel143/Time_Manager_Mirror.git
          ssh_private_key: ${{ secrets.MIRROR_SSH_KEY }}
