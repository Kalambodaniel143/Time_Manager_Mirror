version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-time_manager_dev}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${PGPORT:-5433}:5432"

  phoenix:
    build: ./time_manager
    depends_on:
      - db
      - mailpit
    env_file: ./.env
    environment:
      PGHOST: db
      PGPORT: "5432"
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: "1025"
    volumes:
      - ./.env:/app/.env:ro
    ports:
      - "4000:4000"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  dashboard:
    build: ./time-manager-dashboard
    depends_on:
      - phoenix
    ports:
      - "8080:80"

volumes:
  db_data:
