site_name: Time Manager
site_description: Documentation technique, architecture, sécurité et exploitation du projet Time Manager
site_author: Équipe Time Manager
docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest

nav:
  - Vue d'ensemble: index.md
  - Installation: INSTALLATION.md
  - Architecture et flux: ARCHITECTURE.md
  - Backend et API: BACKEND.md
  - Frontend: FRONTEND.md
  - DevOps et déploiement: DEVOPS.md
  - Dépannage: FAQ.md
  - Glossaire: GLOSSAIRE.md
  - Références:
      - Guide API historique: API.md
      - Docker et environnements: DOCKER_ENVIRONNEMENTS.md
      - Contrat organisations: CONTRAT_BACKEND_ORGANISATIONS.md
      - Recette des validations: RECETTE_VALIDATIONS.md
      - Workflows de déploiement: DEPLOIEMENT_WORKFLOWS.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: fr

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
